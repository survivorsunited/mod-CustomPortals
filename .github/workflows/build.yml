name: build-and-release-1.21.11

on:
  pull_request:
    branches:
      - v1.21.11
  push:
    branches:
      - v1.21.11
    tags:
      - 'v1.21.11-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-portals-1.21.11-${{ github.ref }}
  cancel-in-progress: false

env:
  MC_VERSION: '1.21.11'
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build 1.21.11 jar
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.package.outputs.mod_version }}
      jar_name: ${{ steps.package.outputs.jar_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: microsoft

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Confirm branch version pins
        run: |
          set -euo pipefail
          grep -E '^[[:space:]]*minecraft_version[[:space:]]*=[[:space:]]*1\.21\.11[[:space:]]*$' gradle.properties
          grep -E '^[[:space:]]*java_version[[:space:]]*=[[:space:]]*21[[:space:]]*$' gradle.properties
          grep -E '^[[:space:]]*fabric_version[[:space:]]*=.*\+1\.21\.11[[:space:]]*$' gradle.properties
          echo '✅ gradle.properties is pinned to Minecraft 1.21.11'

      - name: Build
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Package release jar
        id: package
        run: |
          set -euo pipefail
          MOD_NAME=$(grep '^[[:space:]]*jar_name[[:space:]]*=' gradle.properties | sed 's/^[[:space:]]*jar_name[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]')
          MOD_VERSION=$(grep '^[[:space:]]*mod_version[[:space:]]*=' gradle.properties | sed 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]')

          echo "MOD_NAME=$MOD_NAME"
          echo "MOD_VERSION=$MOD_VERSION"
          echo 'Files in build/libs:'
          ls -la build/libs/

          ORIGINAL_JAR=$(find build/libs -maxdepth 1 -type f -name "${MOD_NAME}-${MOD_VERSION}.jar" ! -name '*sources*' ! -name '*dev*' | head -n 1)
          if [ -z "$ORIGINAL_JAR" ]; then
            echo 'Exact jar not found; trying fallback pattern.'
            ORIGINAL_JAR=$(find build/libs -maxdepth 1 -type f -name "${MOD_NAME}-*.jar" ! -name '*sources*' ! -name '*dev*' | head -n 1)
          fi

          if [ -z "$ORIGINAL_JAR" ]; then
            echo "❌ Could not find built jar for ${MOD_NAME}-${MOD_VERSION}"
            exit 1
          fi

          mkdir -p release-artifacts
          VERSIONED_JAR="release-artifacts/${MOD_NAME}-${MOD_VERSION}-${MC_VERSION}.jar"
          cp "$ORIGINAL_JAR" "$VERSIONED_JAR"

          echo "jar_file=$VERSIONED_JAR" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$VERSIONED_JAR")" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Packaged $VERSIONED_JAR"

      - name: Validate jar contents
        run: |
          set -euo pipefail
          JAR="release-artifacts/${{ steps.package.outputs.jar_name }}"
          MOD_VERSION="${{ steps.package.outputs.mod_version }}"

          jar tf "$JAR" | grep 'dev/custom/portals/blocks/PortalBlock21_9.class'
          jar tf "$JAR" | grep 'dev/custom/portals/mixin/ServerPlayerEntityMixin21_9.class'
          unzip -p "$JAR" fabric.mod.json > built-fabric.mod.json
          grep '"minecraft": ">=1.21.11"' built-fabric.mod.json
          grep "\"version\": \"$MOD_VERSION\"" built-fabric.mod.json
          echo '✅ Jar has 1.21.11 portal classes and metadata'

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-portals-${{ steps.package.outputs.mod_version }}-1.21.11
          path: release-artifacts/*.jar
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v1.21.11-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: custom-portals-${{ needs.build.outputs.mod_version }}-1.21.11
          path: release-artifacts

      - name: Show release files
        run: ls -lah release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Custom Portals ${{ needs.build.outputs.mod_version }} for Minecraft 1.21.11
          body: |
            ## Custom Portals ${{ needs.build.outputs.mod_version }} for Minecraft 1.21.11

            Built from the dedicated `v1.21.11` branch.

            This release targets Minecraft 1.21.11 only.
          files: release-artifacts/*.jar
          draft: false
          prerelease: false
