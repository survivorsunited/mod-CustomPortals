name: item-teleportation
on:
  pull_request:
    paths:
      - 'src/main/java/dev/custom/portals/blocks/PortalBlock.java'
      - 'src/main/java/dev/custom/portals/mixin/ItemEntityMixin.java'
      - 'tests/003-validate-item-teleportation.ps1'
      - '.github/workflows/item-teleportation.yml'
  push:
    paths:
      - 'src/main/java/dev/custom/portals/blocks/PortalBlock.java'
      - 'src/main/java/dev/custom/portals/mixin/ItemEntityMixin.java'
      - 'tests/003-validate-item-teleportation.ps1'
      - '.github/workflows/item-teleportation.yml'
permissions:
  contents: read
jobs:
  logic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: Validate instant item transfer logic
        shell: pwsh
        run: ./tests/003-validate-item-teleportation.ps1
