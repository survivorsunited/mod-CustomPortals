name: item-teleportation
on:
  pull_request:
    paths:
      - 'src/main/java/dev/custom/portals/blocks/PortalBlock.java'
      - 'src/main/java/dev/custom/portals/mixin/ItemEntityMixin.java'
      - 'tests/003-validate-item-teleportation.ps1'
      - '.github/workflows/item-teleportation.yml'
      - 'src/gametest/**'
      - 'src/main/java-1.21.11/**'
      - 'src/main/java-1.21.9/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'settings.gradle'
  push:
    paths:
      - 'src/main/java/dev/custom/portals/blocks/PortalBlock.java'
      - 'src/main/java/dev/custom/portals/mixin/ItemEntityMixin.java'
      - 'tests/003-validate-item-teleportation.ps1'
      - '.github/workflows/item-teleportation.yml'
      - 'src/gametest/**'
      - 'src/main/java-1.21.11/**'
      - 'src/main/java-1.21.9/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'settings.gradle'
permissions:
  contents: read
jobs:
  logic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: Validate instant item transfer logic
        shell: pwsh
        run: ./tests/003-validate-item-teleportation.ps1
  minecraft-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/wrapper-validation@v4
      - run: chmod +x ./gradlew
      - name: Build and test on Minecraft 1.21.11
        run: ./gradlew clean build runGameTest --no-daemon
      - name: Preserve Minecraft test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.21.11-validation
          path: |
            build/libs/*.jar
            build/run/gameTest/logs/
            build/run/gameTest/*.xml
          if-no-files-found: warn
